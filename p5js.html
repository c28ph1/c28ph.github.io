<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>
</head>
<body>
	<script>
		let xpos
		let ypos
		function setup() {
			createCanvas(800,800)
			background(255)
			noStroke()
			xpos = width/2
			ypos = height/2
		}

		function draw() {
			// move right, move left, move top, move bottom
			let randomNumber = floor(random(4))
			let randomColor = random(["#004E64","#00A5CF","#9FFFCB","#25A18E","#7AE582"])

			if (randomNumber == 0) {
				xpos = xpos + 10
			} else if (randomNumber == 1) {
				xpos = xpos - 10
			} else if (randomNumber == 2) {
				ypos = ypos + 10
			} else if (randomNumber == 3) {
				ypos = ypos - 10
			}
			fill(randomColor)
			circle(xpos, ypos, 10)
		}

	</script>
</body>
</html>
