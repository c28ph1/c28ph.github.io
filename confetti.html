<!DOCTYPE html>
<html>
<head>

	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Outline&family=Major+Mono+Display&display=swap" rel="stylesheet">

	<style type="text/css">

		body{
			background-color: white;
		}

		.littles{
			width: 15px;
			height: 30px;
			display: inline-block;
			position: absolute;
			top: 100px;
			left: 200px;
			animation-name: swing;
			animation-duration: 10s;
			animation-iteration-count: infinite;
			animation-name: swing3d;
			animation-duration: 10s;
			animation-iteration-count: infinite;
			outline: ;
		}

		@keyframes swing{
			from{
				transform: rotate(var(--startRot));
			}

			to{
				transform: rotate(var(--endRot));
			}
		}

		@keyframes swing3d{
			from{
				transform: rotateZ(-25deg) rotateY(-180deg);
			}

			to{
				transform: rotateZ(25deg) rotateY(180deg);
			}
		}

		#text{
			font-size: 150px;
			color: white;
			font-family: "Londrina Outline";
			position: relative;
			left: 30%;
			top: 300px;
		}


	</style>
</head>
<body>

	<button id="Button">drop confetti</button>
	<input type="color" value="#ff0000" id="colorPicker">

	<div id="text">CONFETTI</div>

	<script type="text/javascript">

			let dropConfettiButtton = document.getElementById("Button")
		
			let colors = ["#06AED5", "#086788", "#F0C808", "#FFF1D0", "#DD1C1A"]

			function makeConfetti (){
			let confetti = document.createElement("div")
			confetti.classList.add("littles")
			document.body.appendChild(confetti)

			let r= Math.round(Math.random()*255)
			let g= Math.round(Math.random()*255)
			let b= Math.round(Math.random()*255)
			let rotation = Math.random() * 360

			let startRot = Math.random() * -60 + "deg"
			let endRot = Math.random() * 60 + "deg"

			let randomColorIndex = Math.floor(Math.random() * colors.length)
			console.log(colors[randomColorIndex])
			confetti.style.backgroundColor = colorPicker.value

			// confetti.style.backgroundColor="rgb("+r+","+g+","+b+")"

			confetti.style.top=Math.random()*1000 + "px"
			confetti.style.left=Math.random()*1500 + "px"

			function fall() {
				let fallFactor = 10
				confetti.style.top = parseInt(confetti.style.top) + fallFactor + "px"
				if (parseInt(confetti.style.top) > 1000) {
					confetti.style.top = "10px"
				}
			}
			setInterval(fall, 50)
			}
	

			dropConfettiButtton.addEventListener("click", function() {

				for(let i=0; i < 10; i++) {
				makeConfetti()
				}
			})		

	</script>


</body>
</html>
