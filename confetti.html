<!DOCTYPE html>
<html>
<head>

	<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Londrina+Outline&family=Major+Mono+Display&display=swap" rel="stylesheet">

	<style type="text/css">

		body{
			background-color: black;
		}

		.littles{
			width: 15px;
			height: 30px;
			display: inline-block;
			position: absolute;
			top: 100px;
			left: 200px;
			animation-name: fall;
			animation-duration: 10s;
			animation-iteration-count: infinite;
		}

		@keyframes fall{
			0%{
				top: -100px;
				rotate: 50deg;
			}

			100%{
				top: 1500px;
				rotate: 250deg;
			}
		}

		#text{
			font-size: 150px;
			color: white;
			font-family: "Londrina Outline";
			position: relative;
			left: 30%;
			top: 300px;

		}

	</style>
</head>
<body>

	<div id="text">CONFETTI</div>

	<script type="text/javascript">
		
		function makeConfetti (){
			let confetti = document.createElement("div")
			confetti.classList.add("littles")
			document.body.appendChild(confetti)	

			let r= Math.round(Math.random()*255)
			let g= Math.round(Math.random()*255)
			let b= Math.round(Math.random()*255)

			confetti.style.backgroundColor="rgb("+r+","+g+","+b+")"

			confetti.style.left=Math.random()*2000 + "px"
			confetti.style.top=Math.random()*1000 + "px"

			confetti.style.width=Math.random()*20 + "px"
			confetti.style.height=Math.random()*60 + "px"

			confetti.style.rotate = Math.random()*600 + "deg" 

		}

			setInterval(makeConfetti, 20)

			

	</script>


</body>
</html>
