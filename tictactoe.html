<!DOCTYPE html>
<html>
<head>
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 150px;
    background-color: #D5F9DE; color: #7D84B2;}
    table { margin: 20px auto; border-collapse: collapse; top:}
    td {
      width: 100px; height: 100px;
      border: 3px solid black;
      font-size: 75px; text-align: center; vertical-align: middle; border-color: #7D84B2;
      top: 200px;}
    td:hover 
    #message { font-size: 30px; margin: 10px;}
  </style>
</head>
<body>

  <h1>Tic-Tac-Toe</h1>
  <div id="message">PLAYER X'S TURN</div>

  <table>
    <tr>
      <td onclick="makeMove(0)"></td>
      <td onclick="makeMove(1)"></td>
      <td onclick="makeMove(2)"></td>
    </tr>
    <tr>
      <td onclick="makeMove(3)"></td>
      <td onclick="makeMove(4)"></td>
      <td onclick="makeMove(5)"></td>
    </tr>
    <tr>
      <td onclick="makeMove(6)"></td>
      <td onclick="makeMove(7)"></td>
      <td onclick="makeMove(8)"></td>
    </tr>
  </table>

  <script>
    var board = ["","","","","","","","",""];
    var currentPlayer = "X";
    var gameOver = false;

    var wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

    function makeMove(i) {
      if (gameOver || board[i] != "") return;

      board[i] = currentPlayer;
      document.getElementsByTagName("td")[i].innerHTML = currentPlayer;

      if (checkWinner()) {
        document.getElementById("message").innerHTML = "PLAYER " + currentPlayer + " WINS!!!";
        gameOver = true;
      } else if (board.indexOf("") == -1) {
        document.getElementById("message").innerHTML = "IT'S A TIE!!!";
        gameOver = true;
      } else {
        currentPlayer = (currentPlayer == "X") ? "O" : "X";
        document.getElementById("message").innerHTML = "PLAYER " + currentPlayer + "'S TURN";
      }
    }

    function checkWinner() {
      for (var i = 0; i < wins.length; i++) {
        var a = wins[i][0], b = wins[i][1], c = wins[i][2];
        if (board[a] != "" && board[a] == board[b] && board[b] == board[c]) return true;
      }
      return false;
    }

  </script>
</body>
</html>
