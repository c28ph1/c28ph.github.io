<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.12/lib/p5.min.js"></script>
</head>
<body>
	<script>
		function setup() {
			createCanvas(500, 500);
		}

		function draw() {
			background('white')

		fill(2, 47, 64)
			
			for (let x = 25; x < 400; x += 50)
			for (let y = 25; y < 400; y += 50) {
  circle(x, y, 50);}

  	fill(56, 174, 204)

  		for (let a = 25; a < 400; a += 50)
			for (let b = 25; b < 400; b += 50) {
  circle(a, b, 40);}

  	fill(0, 144, 193)

  		for (let c = 25; c < 400; c += 50)
			for (let d = 25; d < 400; d += 50) {
  circle(c, d, 30);}

  	fill(24, 52, 70)

  		for (let e = 25; e < 400; e += 50)
			for (let f = 25; f < 400; f += 50) {
  circle(e, f, 20);}

    fill(4, 110, 143)

  		for (let g = 25; g < 400; g += 50)
			for (let h = 25; h < 400; h += 50) {
  circle(g, h, 10);}

  	fill(4, 102, 243)

  		for (let g = 25; g < 400; g += 50)
			for (let h = 25; h < 400; h += 50) {
  circle(g, h, 5);}


		
		
		}
	</script>
</body>
</html>
