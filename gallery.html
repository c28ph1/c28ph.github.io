<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Document</title>
	<style>
		.container{
			display: grid;
			grid-template-columns: repeat(2, 1fr);
		}

		.item{
			border: 1px solid black;
			height: 750px;
			width: 750px;
		}

		#image1{
			background-image: url(https://upload.wikimedia.org/wikipedia/commons/a/a4/The_Beatles_Abbey_Road_album_cover.jpg);
			background-size: contain;
			background-repeat: no-repeat;
		}

		#image2{
			background-image: url(https://m.media-amazon.com/images/I/71BekDJBb3L._UF1000,1000_QL80_.jpg);
			background-size: contain;
			background-repeat: no-repeat;
		}

		#image3{
			background-image: url(https://i.scdn.co/image/ab67616d00001e025af815ed6a1739e122734076);
			background-size: contain;
			background-repeat: no-repeat;
		}

		#image4{
			background-image: url(https://m.media-amazon.com/images/I/91PbdrEjhaL._UF1000,1000_QL80_.jpg);
			background-size: contain;
			background-repeat: no-repeat;
		}

		#image5{
			background-image: url(https://m.media-amazon.com/images/I/713MDgNsD6L._UF1000,1000_QL80_.jpg);
			background-size: contain;
			background-repeat: no-repeat;
		}

		#image6{
			background-image: url(https://upload.wikimedia.org/wikipedia/en/5/55/Michael_Jackson_-_Thriller.png);
			background-size: contain;
			background-repeat: no-repeat;
		}

	</style>
</head>
<body>
	<div class="container">
		<div class="item" id="image1"></div>
		<div class="item" id="image2"></div>
		<div class="item" id="image3"></div>
		<div class="item" id="image4"></div>
		<div class="item" id="image5"></div>
		<div class="item" id="image6"></div>
	</div>

</body>
</html>
